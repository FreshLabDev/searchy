# Minimal SearXNG config for a PRIVATE, bot-only instance.
# Key points for the bot to work:
#   - `formats` MUST include `json` (off by default) or format=json returns 403.
#   - `limiter: false` because this instance is reachable only on the internal
#     Docker network. If you ever expose it publicly, set limiter: true and wire
#     a Valkey/Redis service (see SearXNG docs) instead of leaving it off.
# After editing this file, RESTART the searxng container.

use_default_settings: true

general:
  instance_name: "searchy"
  debug: false

server:
  # The official image's entrypoint replaces the literal "ultrasecretkey" with
  # the SEARXNG_SECRET env var at startup — keep this sentinel value here.
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false
  # Searchy uses form-encoded POST so query text never appears in access URLs.
  method: "POST"

search:
  safe_search: 0          # show everything — no safe search
  formats:
    - html
    - json
  autocomplete: ""

outgoing:
  # Direct egress with a tight per-engine budget. Searchy supplies the user's
  # locale and adds one English core fallback only for weak localized results.
  request_timeout: 2.0
  max_request_timeout: 3.0
  pool_connections: 200
  pool_maxsize: 100
  enable_http2: false

# Keep known-blocked adapters disabled. Explicit core/discovery pools are sent
# by Searchy, so no broad category fan-out is used.
engines:
  - name: brave.images
    disabled: true
  - name: brave.videos
    disabled: true
  - name: vimeo
    disabled: true
  - name: wikicommons.videos
    disabled: true
  - name: google cse images
    disabled: true
  - name: startpage images
    disabled: true
  - name: giphy
    disabled: false
  - name: wikicommons.images
    disabled: false
