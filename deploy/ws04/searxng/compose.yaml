# Independent SearXNG stack on WS04 (/opt/stacks/searxng).
# Reachable only on the shared external network `searchy_net` as host `searxng`.
# Not published to the host — internal use by the searchy bot only.
services:
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng@sha256:77b6ec55d5176fc47cfe91df5e182393133305358741d0c80ebbeec75ac39f99}
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped
    networks:
      - searchy_net

networks:
  searchy_net:
    external: true
