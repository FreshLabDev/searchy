# SPDX-License-Identifier: Apache-2.0
# Searchy production stack on WS04. Identity, language and analytics use the
# shared core-postgres through least-privilege URLs from .env.
#
# The image is pulled, never built here. A stack that builds from a working
# copy on the host runs whatever that copy happened to contain, which is not
# necessarily what CI tested, scanned and published -- and afterwards nothing
# on the host can say which commit it was. The build args this stack used to
# pass (SEARCHY_VERSION / SEARCHY_COMMIT / SEARCHY_BUILD_DATE) were maintained
# by hand in .env for exactly that reason; the release workflow now bakes the
# real ones into the image. SEARCHY_IMAGE must name an immutable GHCR
# reference, digest for preference:
#
#   SEARCHY_IMAGE=ghcr.io/freshlabdev/searchy@sha256:<digest>
#
# A tag is accepted but a digest is what makes a rollback exact.
name: searchy

services:
  bot:
    image: ${SEARCHY_IMAGE:?SEARCHY_IMAGE must be an immutable GHCR reference}
    container_name: searchy-bot
    env_file:
      - ./.env
    environment:
      SEARXNG_URL: http://searxng:8080
      HEALTH_ADDR: ":8081"
      TELEGRAM_BOT_API_BASE_URL: ${TELEGRAM_BOT_API_BASE_URL:-http://telegram-bot-api:8081}
      SHARED_MEDIA_CACHE_DIR: /shared-media-cache
    volumes:
      - /opt/stacks/shared-media-cache:/shared-media-cache:ro
    restart: unless-stopped
    networks:
      - searchy_net
      - core_net
      - telegram_bot_api_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/searchy", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  searchy_net:
    external: true
  core_net:
    external: true
  telegram_bot_api_net:
    external: true
