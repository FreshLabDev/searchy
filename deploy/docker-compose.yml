# Native Go media-search bot + private SearXNG fallback / rollback.
#
# Search settings come from ../.env. Defaults are SEARCH_BACKEND=native and
# SEARCH_FALLBACK=searxng.
# Keep this dependency, config mount and network for fallback and switchback.
# For native-only local use, set SEARCH_FALLBACK=none in ../.env, then run:
# docker compose -f deploy/docker-compose.yml up -d --build --no-deps bot
# Compose still requires SEARXNG_SECRET when resolving the complete manifest.
#
# SearXNG is NOT published to the host — it is reachable only on the internal
# Docker network (fallback uses http://searxng:8080). With the limiter
# disabled this is the simplest, reliable "private instance" posture. If you
# ever expose SearXNG publicly, turn the limiter back on and add a Valkey/Redis
# service (see SearXNG docs) — do not expose it limiter-off.
services:
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      SEARXNG_URL: http://searxng:8080
      HEALTH_ADDR: ":8081"
    depends_on:
      searxng:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/searchy", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Covers the two-minute Telegram Bot API warm-up retry window.
      start_period: 2m30s

  searxng:
    # Keep the proven production digest: engine adapters change frequently.
    image: ${SEARXNG_IMAGE:-searxng/searxng@sha256:77b6ec55d5176fc47cfe91df5e182393133305358741d0c80ebbeec75ac39f99}
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped
    # Intentionally no `ports:` — internal network only.
